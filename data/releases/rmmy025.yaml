  songs:
  - title: UP TO YOU
    text: '真夜中の街は眠って 空飛び越える駆け引き

      通知の音を気にして 風に揺られてる

      毎日話してた頃は 気づかなかったけれど

      思わせぶり 甘い声が リピートしてる


      you’re a sweet boy

      なのに 携帯の中では 無愛想な感じ

      ねぇ 君の本音 見せてほしい


      ふたりの微妙なライン 少し怖いけど

      夜と朝の隙間 つながってたい

      明日 君が 誰かと話すまで

      一番でいたい 無理かな？


      (Baby Boy It’s Up To You)

      好きになったみたい Oh Yeah

      抜け出したいような 夜の上


      新しい景色にも慣れて すれ違う人の中に

      同じ匂いをかぐたび 切なくなる想い

      返信もろくに来ないし 猫みたいに天邪鬼で

      計算してるわけじゃない 余計たち悪いなぁ


      you’re a naughty boy

      なのに 2人きりで会えば

      肩が触れるほど近くて 普通じゃいられない


      ふたりは曖昧なライン 弱虫なハート

      焦れったい距離にまだ 足踏みばかりで

      きっと 私 君まで届くように

      伝えきれない 助けて！


      (Baby Boy It’s Up To You)

      好きになったみたい Oh Yeah

      抜け出したいこの迷路 No way


      ふたりの微妙なライン 少し怖いけど

      夜と朝の隙間 つながってたい

      明日 君が 誰かと話すまで

      一番でいたい 無理かな？


      (Baby Boy It’s Up To You)

      好きになったみたい Oh Yeah

      泣き出しそう だけど All right

      ドキドキしたい Oh Yeah

      近くにいたいよ I love you'
  - title: Adventure
    text: '旅立ちの朝 星と冷たい空気

      東の空を仰いで ひとり汽車を待つ


      使い回した悲しみを 丸めて捨てれば

      そこらじゅう 思い出だらけ

      喉はカラカラ


      時間 距離 記憶 想い

      片道切符の 意味を知る

      浅い夢 覚めたら

      未だ見ぬ街の喧騒へ 忘れたくないから


      旅立ちの朝 星と冷たい空気

      向かい風が頬を刺す

      大人ってなんだろう？


      見慣れた街は 藍色

      優しいあかりが 灯らないうちに行くわ

      はためいてるフラッグ


      時間 距離 記憶 想い

      誰もひとり 旅の途中

      浅い夢 覚めたら

      不確かでも行かなくちゃ 忘れたくないだけ'
  - title: Bitter Imitation
    text: '今年もまたこの季節

      巡ってきたのね

      熱さを亡くした風が

      この胸を満たすわ


      「恋の魔法なんてない」

      気付いた時から

      鏡に映るわたしに

      憂いが似合った


      ねえ キミは忘れたかな

      月に交わした 約束信じてた


      I beg you, call me 届かない

      好きじゃないなんて言わないで

      鍵をかけて 閉じ込めて

      ほら もう離れない


      この想いと現実を

      認めてしまえば

      縋り付いた過去の自分を殺すの


      「キミの気持ちはもうない」

      気付いた時でも

      燃え尽きた夢から

      両目を瞑った


      ねえ わたし憶えてるよ

      恋に落ちた魔法の瞬間を


      I beg you, call me 届かない

      好きじゃないなんて言えなくて

      分かってるわ言わないで

      ほら もう 戻らない'
  - title: 星の夜に
    text: 'ほんの小さな愛を見つけた

      こんなにきれいなのに

      まっすぐ見れずにこぼれていく

      こんなにきれいなのに


      日が落ちても寒くなくなった

      移ろいでいく街並み

      アメジスト色の花が揺れる

      約束の草原へ 静かに歩き始めた

      (Starry Night)


      瞬く 星の夜に

      ただひとつの願い

      色褪せない

      たどり着きたい


      さよなら 伸びるテールライト

      私の気持ちは

      今も変わらない


      面影求め さまよっていた

      ここには見あたらない

      誰かが育てた優しさは

      僕には受け取れない


      西の空に大きく赤い月

      ランプの熱が 目にしみる

      エメラルドの海が波を打つ

      約束の草原へ 静かに歩き始めた

      (Starry Night)


      瞬く 星の夜に

      ただひとつの願い

      色褪せない

      たどり着きたい


      さよなら 伸びるテールライト

      私の気持ちは

      今も変わらない


      瞬く 星の夜に

      僕ら巡り会い

      あてどなく 時を数えた


      心は進み出した なのに ねぇ どうして

      涙 溢れ出す

      (Starry Night)


      瞬く 星の夜に

      ただひとつの願い

      色褪せない

      たどり着きたい


      さよなら 伸びるテールライト

      ありがとう 願いは

      今も変わらない


      今も変わらない'
  - title: MAPLE SWEET
    text: 'Do you wanna la-la-love

      今日のわたしは 背伸びしたシンデレラ

      気付いてるかな とろけるリップ

      魔法信じて とびきりの smile


      今何時？

      鏡の前

      あっちこっち あわてる morning

      ねぇ どっちがいい？ オレンジとピンク

      あぁ どうしよう 決まらない

      Non non


      待ち合わせ 時計台

      午前9時まで あと little bit

      仕上げの魔法を かけたなら

      君のもとへと かけてく sweet


      Do you wanna la-la-love

      感じてる Let me do

      maple sweet に 1,2,3,4,5

      気付いてるかな ゆるめのチーク

      魔法信じて 強気の smile


      また同じ？

      あいまいな返事

      もっとこっち 気づいて darling

      ねぇ 似合ってる？ ピンクのグロス

      あぁどうしよう じれったい

      NonNon


      秒針は 早足ね

      よる12時まで あと little bit

      私の魔法は 解けないわ

      君と一緒に まだまだ sweet


      Do you wanna la-la-love

      今日のわたしは 背伸びしたシンデレラ

      気付いてるかな とろけるリップ

      魔法信じて とびきりの smile


      不思議な tapping tips

      へたでも keep on trying

      夢見がち 1,2,3,4,5

      誘ってみせるの 君のこと

      ふんわりパンプス 背伸びでキス


      明けないで sweet night

      優しいのよ moon light

      溶けちゃうのよ limit time


      Do you wanna la-la-love

      今日のわたしは 背伸びしたシンデレラ

      気づいてるよね maple sweet

      魔法信じて 強気の smile'
  - title: ginger ale*romance
    text: 'きしんだ扉開く度君を探してる

      毎週木曜日の午後のあの足音


      本当は見飽きてるはずなのに花瓶に目をやって

      窓際俯いた君を盗み見してたら目が合ったの


      気付かれたかな

      どうして　火照った頬は冷めないまま？

      ベルが鳴ってる行かなくちゃ

      鼓動聞かれてしまいそうさ


      スパイス効かせてジンジャエール

      それとプリン

      決まって君はそう言って少しはにかむ


      生姜と蜂蜜と檸檬少し多めのスパイス


      仕上げにミントを添えて

      よそゆきの顔で氷が笑う

      行かなくちゃ

      ジンジャエールに魔法かけて


      もう少しだけ見ていたい

      うっかり忘れ物をしてよ

      駆け出した恋　高鳴る鼓動

      今ならきっと言えるはずさ


      君に毎日作りたいの

      スパイス効かせてジンジャエール


      駆け出した恋

      君に追いつき

      そしたらきっと言えるはずさ

      君に毎日作りたいの

      スパイス効かせてジンジャエール'
  - title: オリーブの思い出
    text: 'わからないこと わからないまま

      大人になってく

      秘密の恋は 今も秘密のまま…


      鳴らしたコード 短いメロディ

      放課後の教室

      好きなものが同じって

      奇跡じゃない？

      みんなで集まろうよ


      オリーブの揺れる島で

      並んで見た夕陽

      水面の きらめきが

      眩しくなるけれど

      時々思い出すだけでいい

      昔の物語


      まっすぐ全力な日々が

      仲間の笑い声が

      今は次の世代へ

      続いててよかった

      間違いじゃないわ 今までのぜんぶ

      訪れるチャンスは 逃したくない


      やるせないこと やるせないまま

      大人になってく

      ご飯は少し

      おいしくなったけど


      人並みの暮らし

      繰り返す景色

      誰のためだっけ？

      深呼吸ひとつ

      目を閉じれば 聞こえる

      さざ波の音


      オリーブの揺れる島で

      長く伸びた影と

      花火のきらめきが

      眩しくなるけれど

      時々思い出すだけでいい

      昔の物語


      まっすぐ全力な日々が

      仲間の笑い声が

      まだ見ぬ子供たちの

      居場所であるように

      間違いじゃないわ これからもずっと

      次に起こる奇跡を 見てみたい


      だけど 夜の帳

      不安と寂しさ顔を出す

      内緒の約束が一つ

      今でもまだ言えない


      あの夏

      オリーブの揺れる島で

      並んで見た夕陽

      水面の きらめきが

      眩しくなるけれど

      思い出だけで生きれるほど

      甘くはない人生


      まっすぐ全力な日々が

      仲間の笑い声が

      私たちの電池

      さあ今日もやっていこう！


      大人になるって

      痛いけど楽しみ

      秘密の恋は 今も秘密のまま…


      それぞれの音楽が 続いていく'
