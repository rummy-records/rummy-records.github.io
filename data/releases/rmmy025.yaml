pre:
- What is 女子力？<br>大阪大学 音楽制作サークル ラムレーズンのメンバーによって結成された"歌ってつくれるアイドルユニット"。全員が楽曲製作に携わり、コンピレーションアルバムへの楽曲提供や学内外でのライブイベントへの出演など、精力的に活動している。
