tagline: 私たち、歌ってつくれるアイドル、"女子力"です！<br>大阪大学 音楽制作サークル ラムレーズンのメンバーによって結成された"女子力"。この春、5年間の活動の集大成となるファーストアルバム「DTM Girl」をリリース！
