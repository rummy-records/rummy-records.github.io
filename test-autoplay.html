<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>player looks test</title>
<style>body{font-family:sans-serif;margin:20px}section{margin:0 0 34px}iframe{border:0;display:block;background:#eee}</style>
</head>
<body>
<h1>Bandcamp player looks (album 440035753)</h1>
<section>
  <h2>1. small (current)</h2>
  <button data-t="f1" data-u="https://bandcamp.com/EmbeddedPlayer/album=440035753/size=small/bgcol=ffffff/linkcol=c67223/transparent=true/">load 1</button>
  <iframe id="f1" width="100%" height="42"></iframe>
</section>
<section>
  <h2>2. large</h2>
  <button data-t="f2" data-u="https://bandcamp.com/EmbeddedPlayer/album=440035753/size=large/bgcol=ffffff/linkcol=c67223/transparent=true/">load 2</button>
  <iframe id="f2" width="100%" height="120"></iframe>
</section>
<section>
  <h2>3. large artwork=none tracklist=false</h2>
  <button data-t="f3" data-u="https://bandcamp.com/EmbeddedPlayer/album=440035753/size=large/bgcol=ffffff/linkcol=c67223/artwork=none/tracklist=false/transparent=true/">load 3</button>
  <iframe id="f3" width="100%" height="120"></iframe>
</section>
<script>
  document.querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.getElementById(b.dataset.t).src = b.dataset.u;
    });
  });
</script>
</body>
</html>
